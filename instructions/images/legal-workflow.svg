  <rect x="20" y="248" width="910" height="44" rx="10" fill="#F3F7FC" stroke="#D6E2F2"/>
  <text x="475" y="275" text-anchor="middle" font-size="13.5" fill="#1F1F1F"><tspan font-weight="700">Work IQ and iManage</tspan> bring the matter into Word and Cowork: <tspan font-weight="700">nothing is uploaded, and nothing is sent until you approve.</tspan></text>

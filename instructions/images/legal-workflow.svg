  <rect x="0" y="0" width="950" height="310" fill="#FFFFFF"/>
  <rect x='20' y='20' width='205' height='210' rx='10' fill='#FFFFFF' stroke='#D6D6D6'/>
  <path d='M20,76 V30 a10,10 0 0 1 10,-10 H215 a10,10 0 0 1 10,10 V76 z' fill='#185ABD'/>
  <text x='34' y='42' class='step'>Step 1</text><text x='34' y='64' class='title'>Catch up</text>
  <text x='34' y='100' class='label'>WHERE</text><text x='34' y='120' class='where'>Word</text><text x='34' y='137' class='hint'>Open the Copilot pane</text>
  <text x='34' y='166' class='label'>YOU GET</text><text x='34' y='186' class='get'>The backstory in five</text><text x='34' y='203' class='get'>bullets, linked to email</text><text x='34' y='220' class='get'>and Teams</text>
  <line x1='229' y1='125' x2='251' y2='125' stroke='#8A8A8A' stroke-width='2' marker-end='url(#arrow)'/>
  <rect x='255' y='20' width='205' height='210' rx='10' fill='#FFFFFF' stroke='#D6D6D6'/>
  <path d='M255,76 V30 a10,10 0 0 1 10,-10 H450 a10,10 0 0 1 10,10 V76 z' fill='#185ABD'/>
  <text x='269' y='42' class='step'>Step 2</text><text x='269' y='64' class='title'>Flag the hard stops</text>
  <text x='269' y='100' class='label'>WHERE</text><text x='269' y='120' class='where'>Word</text><text x='269' y='137' class='hint'>Same Word chat</text>
  <text x='269' y='166' class='label'>YOU GET</text><text x='269' y='186' class='get'>A comment on every</text><text x='269' y='203' class='get'>clause that breaks the</text><text x='269' y='220' class='get'>iManage playbook</text>
  <line x1='464' y1='125' x2='486' y2='125' stroke='#8A8A8A' stroke-width='2' marker-end='url(#arrow)'/>
  <rect x='490' y='20' width='205' height='210' rx='10' fill='#FFFFFF' stroke='#D6D6D6'/>
  <path d='M490,76 V30 a10,10 0 0 1 10,-10 H685 a10,10 0 0 1 10,10 V76 z' fill='#185ABD'/>
  <text x='504' y='42' class='step'>Step 3</text><text x='504' y='64' class='title'>Fix the must-haves</text>
  <text x='504' y='100' class='label'>WHERE</text><text x='504' y='120' class='where'>Word</text><text x='504' y='137' class='hint'>Same Word chat</text>
  <text x='504' y='166' class='label'>YOU GET</text><text x='504' y='186' class='get'>Tracked changes for</text><text x='504' y='203' class='get'>model ownership and</text><text x='504' y='220' class='get'>notice, each explained</text>
  <line x1='699' y1='125' x2='721' y2='125' stroke='#8A8A8A' stroke-width='2' marker-end='url(#arrow)'/>
  <rect x='725' y='20' width='205' height='210' rx='10' fill='#FFFFFF' stroke='#D6D6D6'/>
  <path d='M725,76 V30 a10,10 0 0 1 10,-10 H920 a10,10 0 0 1 10,10 V76 z' fill='#0F6CBD'/>
  <text x='739' y='42' class='step'>Step 4</text><text x='739' y='64' class='title'>Negotiation pack</text>
  <text x='739' y='100' class='label'>WHERE</text><text x='739' y='120' class='where'>Copilot</text><text x='739' y='137' class='hint'>Cowork, opened from Word</text>

  <rect x='490' y='20' width='205' height='210' rx='10' fill='#FFFFFF' stroke='#D6D6D6'/>
  <path d='M490,76 V30 a10,10 0 0 1 10,-10 H685 a10,10 0 0 1 10,10 V76 z' fill='#107C41'/>
  <text x='504' y='42' class='step'>Steps 2b and 2c</text><text x='504' y='64' class='title'>Scenarios and credit</text>

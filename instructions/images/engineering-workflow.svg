<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 950 310" width="950" height="310" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#8A8A8A"/>
    </marker>
    <style>
      .label { font-size: 10.5px; font-weight: 700; fill: #6B6B6B; letter-spacing: 0.8px; }
      .where { font-size: 14px; font-weight: 600; fill: #1F1F1F; }
      .hint { font-size: 12px; fill: #555555; }
      .get { font-size: 13px; fill: #1F1F1F; }
      .step { font-size: 12px; fill: #FFFFFF; fill-opacity: 0.9; }
      .title { font-size: 15px; font-weight: 700; fill: #FFFFFF; }
    </style>
  </defs>
  <rect x="0" y="0" width="950" height="310" fill="#FFFFFF"/>
  <rect x='20' y='20' width='205' height='210' rx='10' fill='#FFFFFF' stroke='#D6D6D6'/>
  <path d='M20,76 V30 a10,10 0 0 1 10,-10 H215 a10,10 0 0 1 10,10 V76 z' fill='#0F6CBD'/>
  <text x='34' y='42' class='step'>Step 1</text><text x='34' y='64' class='title'>Check the sprint</text>
  <text x='34' y='100' class='label'>WHERE</text><text x='34' y='120' class='where'>Copilot</text><text x='34' y='137' class='hint'>New chat, Chat mode</text>
  <text x='34' y='166' class='label'>YOU GET</text><text x='34' y='186' class='get'>The one Sprint 24 item</text><text x='34' y='203' class='get'>at risk: AUR-142</text>
  <line x1='229' y1='125' x2='251' y2='125' stroke='#8A8A8A' stroke-width='2' marker-end='url(#arrow)'/>
  <rect x='255' y='20' width='205' height='210' rx='10' fill='#FFFFFF' stroke='#D6D6D6'/>
  <path d='M255,76 V30 a10,10 0 0 1 10,-10 H450 a10,10 0 0 1 10,10 V76 z' fill='#0F6CBD'/>
  <text x='269' y='42' class='step'>Step 2</text><text x='269' y='64' class='title'>Find the blocker</text>
  <text x='269' y='100' class='label'>WHERE</text><text x='269' y='120' class='where'>Copilot</text><text x='269' y='137' class='hint'>Same chat</text>
  <text x='269' y='166' class='label'>YOU GET</text><text x='269' y='186' class='get'>What AUR-142 is waiting</text><text x='269' y='203' class='get'>on, joined across EngHub,</text><text x='269' y='220' class='get'>EngHub Docs and GitHub</text>
  <line x1='464' y1='125' x2='486' y2='125' stroke='#8A8A8A' stroke-width='2' marker-end='url(#arrow)'/>
  <rect x='490' y='20' width='205' height='210' rx='10' fill='#FFFFFF' stroke='#D6D6D6'/>
  <path d='M490,76 V30 a10,10 0 0 1 10,-10 H685 a10,10 0 0 1 10,10 V76 z' fill='#0F6CBD'/>
  <text x='504' y='42' class='step'>Step 3</text><text x='504' y='64' class='title'>Ask for the decision</text>
  <text x='504' y='100' class='label'>WHERE</text><text x='504' y='120' class='where'>Copilot</text><text x='504' y='137' class='hint'>New task, Cowork mode</text>
  <text x='504' y='166' class='label'>YOU GET</text><text x='504' y='186' class='get'>A Teams message to</text><text x='504' y='203' class='get'>Tama, sent after you</text><text x='504' y='220' class='get'>approve it</text>
  <line x1='699' y1='125' x2='721' y2='125' stroke='#8A8A8A' stroke-width='2' marker-end='url(#arrow)'/>
  <rect x='725' y='20' width='205' height='210' rx='10' fill='#FFFFFF' stroke='#D6D6D6'/>
  <path d='M725,76 V30 a10,10 0 0 1 10,-10 H920 a10,10 0 0 1 10,10 V76 z' fill='#0F6CBD'/>
  <text x='739' y='42' class='step'>Step 4</text><text x='739' y='64' class='title'>Make the slide</text>
  <text x='739' y='100' class='label'>WHERE</text><text x='739' y='120' class='where'>Copilot</text><text x='739' y='137' class='hint'>Same Cowork task</text>
  <text x='739' y='166' class='label'>YOU GET</text><text x='739' y='186' class='get'>A one-slide sprint</text><text x='739' y='203' class='get'>update for leadership</text>
  <rect x="20" y="248" width="910" height="44" rx="10" fill="#F3F7FC" stroke="#D6E2F2"/>
  <text x="475" y="275" text-anchor="middle" font-size="13.5" fill="#1F1F1F"><tspan font-weight="700">EngHub, EngHub Docs and GitHub</tspan> each hold part of the story: <tspan font-weight="700">Copilot joins them in Chat, then Cowork acts on it.</tspan></text>
</svg>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Historical Price Summaries</title>
<!-- include:_kit.css.html -->
<style>
  .ph { display: flex; justify-content: space-between; align-items: flex-start; gap: 16px; padding: 4px 2px 14px; flex-wrap: wrap; }
  .ric { font-size: 18px; font-weight: 700; }
  .sub { font-size: 12px; color: var(--fg-2); margin-top: 2px; }
  .px { text-align: right; }
  .last { font-size: 24px; font-weight: 700; letter-spacing: -.01em; }
  .chg { font-size: 13px; font-weight: 600; margin-top: 2px; }
  .chg.up { color: var(--up); } .chg.down { color: var(--down); }
  .toggle { display: inline-flex; gap: 2px; border: 1px solid var(--line); border-radius: 8px; padding: 2px; margin-left: 10px; vertical-align: top; }
  .chart-box { position: relative; user-select: none; }
  .cross line { stroke: var(--fg-2); stroke-width: 1; }
  .pill rect { fill: #1b1d22; }
  .pill text { fill: #fff; font-size: 11px; font-weight: 600; }
  .up-c { fill: var(--up); stroke: var(--up); } .down-c { fill: var(--down); stroke: var(--down); }
  .tip .row { display: flex; justify-content: space-between; gap: 18px; }
</style>
</head>
<body>
<div id="app"><div class="card"><div class="empty">Waiting for LSEG pricing data…</div></div></div>
<!-- include:_kit.js.html -->
<script>
(function () {
  "use strict";
  var K = window.Kit, h = K.h, s = K.s;
  var app = document.getElementById("app");
  var LABELS = {
    TRDPRC_1: "Close", HIGH_1: "High", LOW_1: "Low", OPEN_PRC: "Open", ACVOL_UNS: "Volume", VWAP: "VWAP", BID: "Bid", ASK: "Ask",
    TRNOVR_UNS: "Turnover", NUM_MOVES: "Num Moves", BLKCOUNT: "Block Count", BLKVOLUM: "Block Volume", TRD_STATUS: "Trade Status",
    SALTIM: "Sale Time", NAVALUE: "NAV", VWAP_VOL: "VWAP Volume", ACVOL_DEC: "Volume (Dec)", VWAP_OPEN: "VWAP Open", VWAP_HIGH: "VWAP High",
    VWAP_LOW: "VWAP Low", OPEN_BID: "Open Bid", BID_HIGH_1: "Bid High", BID_LOW_1: "Bid Low", OPEN_ASK: "Open Ask", ASK_HIGH_1: "Ask High", ASK_LOW_1: "Ask Low"
  };
  var FIRST = ["OPEN_PRC", "HIGH_1", "LOW_1", "TRDPRC_1", "ACVOL_UNS", "VWAP", "BID", "ASK"];
  var VOLUME = { ACVOL_UNS: 1, TRNOVR_UNS: 1, BLKVOLUM: 1, VWAP_VOL: 1, ACVOL_DEC: 1 };

  function series(entry) {
    var names = (entry.headers || []).map(function (x) { return x.name; });
    var di = names.findIndex(function (n) { return /^DATE/.test(n); });
    var rows = (entry.data || []).map(function (arr) {
      var o = { _date: K.parseDate(arr[di]), _raw: arr[di] };
      names.forEach(function (n, i) { if (i !== di) o[n] = arr[i]; });
      return o;
    }).filter(function (r) { return r._date; });
    rows.sort(function (a, b) { return a._date - b._date; });
    rows.forEach(function (r, i) {
      r.c = r.TRDPRC_1; r.o = r.OPEN_PRC != null ? r.OPEN_PRC : (i ? rows[i - 1].TRDPRC_1 : r.c);
      r.hi = r.HIGH_1 != null ? r.HIGH_1 : Math.max(r.o, r.c); r.lo = r.LOW_1 != null ? r.LOW_1 : Math.min(r.o, r.c);
    });
    return { names: names.filter(function (_, i) { return i !== di; }), rows: rows.filter(function (r) { return r.c != null; }) };
  }

  function niceTicks(lo, hi, n) {
    var span = hi - lo, raw = span / n, mag = Math.pow(10, Math.floor(Math.log10(raw))), f = raw / mag;
    var step = (f < 1.5 ? 1 : f < 3 ? 2 : f < 7 ? 5 : 10) * mag, out = [];
    for (var v = Math.ceil(lo / step) * step; v <= hi + 1e-9; v += step) out.push(+v.toFixed(6));
    return out;
  }

  function candles(sr, width) {
    var rows = sr.rows, n = rows.length;
    var W = Math.max(340, width), H = 320, L = 58, R = 14, T = 10, B = 30, pw = W - L - R, ph = H - T - B;
    var lo = Math.min.apply(null, rows.map(function (r) { return r.lo; })), hi = Math.max.apply(null, rows.map(function (r) { return r.hi; }));
    var pad = (hi - lo) * 0.06 || 1; lo -= pad; hi += pad;
    function y(v) { return T + ph - (v - lo) / (hi - lo) * ph; }
    function inv(py) { return lo + (T + ph - py) / ph * (hi - lo); }
    var band = pw / n, cw = Math.max(1, Math.min(14, band * 0.62));
    function x(i) { return L + band * i + band / 2; }
    var svg = s("svg", { width: W, height: H, viewBox: "0 0 " + W + " " + H, role: "img", "aria-label": "Candlestick chart" });
    var grid = s("g", { class: "grid" });
    niceTicks(lo, hi, 5).forEach(function (v) {
      grid.appendChild(s("line", { x1: L, x2: W - R, y1: y(v), y2: y(v) }));
      grid.appendChild(s("text", { x: L - 8, y: y(v) + 4, "text-anchor": "end" }, "$" + K.num(v, v < 10 ? 2 : 0)));
    });
    var ticks = Math.min(6, n), every = Math.max(1, Math.round(n / ticks));
    for (var i = Math.floor(every / 2); i < n; i += every) {
      grid.appendChild(s("text", { x: x(i), y: H - 10, "text-anchor": "middle" }, K.fmtDate(rows[i]._date, { month: "short", day: "numeric", year: "numeric" })));
    }
    svg.appendChild(grid);
    var g = s("g");
    rows.forEach(function (r, i) {
      var cls = r.c >= r.o ? "up-c" : "down-c", top = y(Math.max(r.o, r.c)), bot = y(Math.min(r.o, r.c));
      g.appendChild(s("line", { class: cls, x1: x(i), x2: x(i), y1: y(r.hi), y2: y(r.lo), "stroke-width": 1 }));
      g.appendChild(s("rect", { class: cls, x: x(i) - cw / 2, y: top, width: cw, height: Math.max(1, bot - top) }));
    });
    svg.appendChild(g);

    var cross = s("g", { class: "cross", style: "display:none" });
    var vline = s("line", { y1: T, y2: T + ph, "stroke-dasharray": "3 3" });
    var hline = s("line", { x1: L, x2: W - R, "stroke-dasharray": "4 3" });
    var yp = s("g", { class: "pill" }), ypr = s("rect", { rx: 4, height: 18, width: L - 6, x: 2 }), ypt = s("text", { x: L / 2 - 1, "text-anchor": "middle" });
    yp.appendChild(ypr); yp.appendChild(ypt);
    var xp = s("g", { class: "pill" }), xpr = s("rect", { rx: 4, height: 18, width: 96, y: H - 24 }), xpt = s("text", { y: H - 11, "text-anchor": "middle" });
    xp.appendChild(xpr); xp.appendChild(xpt);
    cross.appendChild(vline); cross.appendChild(hline); cross.appendChild(yp); cross.appendChild(xp);
    svg.appendChild(cross);
    var overlay = s("rect", { x: L, y: T, width: pw, height: ph, fill: "transparent", style: "cursor:crosshair" });
    svg.appendChild(overlay);

    var tip = h("div", { class: "tip" });
    var box = h("div", { class: "chart-box" }, svg, tip);
    overlay.addEventListener("mousemove", function (ev) {
      var rect = svg.getBoundingClientRect(), px = ev.clientX - rect.left, py = ev.clientY - rect.top;
      var i = Math.max(0, Math.min(n - 1, Math.floor((px - L) / band))), r = rows[i], cx = x(i);
      cross.style.display = "";
      vline.setAttribute("x1", cx); vline.setAttribute("x2", cx);
      hline.setAttribute("y1", py); hline.setAttribute("y2", py);
      ypr.setAttribute("y", py - 9); ypt.setAttribute("y", py + 4); ypt.textContent = "$" + K.fixed(inv(py), 2);
      var xl = Math.max(L, Math.min(W - R - 96, cx - 48));
      xpr.setAttribute("x", xl); xpt.setAttribute("x", xl + 48);
      xpt.textContent = K.fmtDate(r._date, { month: "short", day: "numeric", year: "numeric" });
      var col = r.c >= r.o ? "var(--up)" : "var(--down)";
      tip.innerHTML = "";
      tip.appendChild(h("div", null, h("b", null, K.fmtDate(r._date, { weekday: "short", month: "short", day: "numeric", year: "numeric" }))));
      [["Open", r.o], ["High", r.hi], ["Low", r.lo], ["Close", r.c]].forEach(function (p) {
        tip.appendChild(h("div", { class: "row" }, h("span", null, h("span", { class: "sw", style: "background:" + col }), p[0]), h("b", null, K.money(p[1]))));
      });
      if (r.ACVOL_UNS != null) tip.appendChild(h("div", { class: "row" }, h("span", { class: "muted" }, "Volume"), h("span", null, K.compact(r.ACVOL_UNS))));
      tip.style.display = "block";
      var tx = cx + 14, ty = Math.max(4, py - tip.offsetHeight / 2);
      if (tx + tip.offsetWidth > W) tx = cx - tip.offsetWidth - 14;
      tip.style.left = tx + "px"; tip.style.top = ty + "px";
    });
    overlay.addEventListener("mouseleave", function () { cross.style.display = "none"; tip.style.display = "none"; });
    return box;
  }

  function dataTable(sr) {
    var names = FIRST.filter(function (n) { return sr.names.indexOf(n) >= 0; })
      .concat(sr.names.filter(function (n) { return FIRST.indexOf(n) < 0; }));
    var cols = [{ key: "_date", label: "Date", render: function (r) { return K.usDate(r._date); } }];
    names.forEach(function (n) {
      cols.push({ key: n, label: LABELS[n] || n, align: "right", render: function (r) {
        var v = r[n]; if (v == null) return "";
        return VOLUME[n] ? K.compact(v) : K.fixed(v, Math.abs(v) >= 1000 && !/PRC|HIGH|LOW|VWAP|BID|ASK/.test(n) ? 0 : 2);
      } });
    });
    return K.table(cols, sr.rows, { sortKey: "_date", sortDir: 1 });
  }

  function interval(entry) { return entry.interval || "P1D"; }
  var views = {};

  function section(entry) {
    var ric = (entry.universe && entry.universe.ric) || "";
    if (entry.status && !(entry.data || []).length) {
      return h("div", { class: "card" }, h("div", { class: "card-head" }, h("h2", { class: "card-title" }, "Historical Price Summaries")),
        h("div", { class: "error" }, (ric ? ric + ": " : "") + (entry.status.message || entry.status.code)));
    }
    var sr = series(entry), rows = sr.rows;
    if (!rows.length) return h("div", { class: "card" }, h("div", { class: "empty" }, "No pricing rows for " + ric));
    var first = rows[0], last = rows[rows.length - 1], chg = last.c - first.c, pct = first.c ? chg / first.c * 100 : 0;
    var hi = Math.max.apply(null, rows.map(function (r) { return r.hi; })), lo = Math.min.apply(null, rows.map(function (r) { return r.lo; }));
    var intraday = /^PT/.test(interval(entry));
    var view = views[ric] || "chart";
    var body = h("div");
    var bChart = K.iconBtn("chart", "Chart view", function () { set("chart"); });
    var bTable = K.iconBtn("table", "Table view", function () { set("table"); });
    var card = h("div", { class: "card" },
      h("div", { class: "card-head" }, h("h2", { class: "card-title" }, "Historical Price Summaries (" + (intraday ? "Intraday" : "Interday") + ")")),
      h("div", { class: "ph" },
        h("div", null, h("div", { class: "ric" }, ric),
          h("div", { class: "sub" }, interval(entry) + " • " + rows.length + " periods"),
          h("div", { class: "sub" }, K.isoDate(first._date) + " - " + K.isoDate(last._date))),
        h("div", { class: "px" },
          h("div", null, h("span", { class: "last" }, K.money(last.c)), h("span", { class: "toggle" }, bChart, bTable)),
          h("div", { class: "chg " + (chg >= 0 ? "up" : "down") }, (chg >= 0 ? "+" : "-") + K.money(Math.abs(chg)) + " (" + (chg >= 0 ? "+" : "") + K.fixed(pct, 2) + "%)"),
          h("div", { class: "sub" }, "High: " + K.money(hi) + " • Low: " + K.money(lo)))),
      body);
    function set(v) {
      view = views[ric] = v;
      bChart.classList.toggle("on", v === "chart"); bTable.classList.toggle("on", v === "table");
      body.innerHTML = "";
      body.appendChild(v === "chart" ? candles(sr, (card.clientWidth || 640) - 38) : dataTable(sr));
    }
    requestAnimationFrame(function () { set(view); });
    var lastW = 0;
    if (window.ResizeObserver) new ResizeObserver(function () {
      var w = card.clientWidth; if (Math.abs(w - lastW) > 4 && view === "chart") { lastW = w; set("chart"); }
    }).observe(card);
    return card;
  }

  function render(result) {
    app.innerHTML = "";
    if (result.isError) {
      var t = (result.content || []).map(function (c) { return c.text || ""; }).join("");
      app.appendChild(h("div", { class: "card" }, h("div", { class: "error" }, t)));
      return;
    }
    var p = K.payload(result) || {};
    var list = Array.isArray(p.data) ? p.data : [];
    list.forEach(function (e) { app.appendChild(section(e)); });
    if (!list.length) app.appendChild(h("div", { class: "card" }, h("div", { class: "empty" }, "No pricing data returned.")));
  }

  K.start({ result: render });
})();
</script>
</body>
</html>

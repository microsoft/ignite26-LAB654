<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Salesforce widget</title>
<style>
  /* Lightning Design System look: neutral greys, brand blue, 0.25rem radii, 13px body text. */
  :root {
    --brand: #0176d3; --brand-dark: #014486; --fg: #181818; --fg-2: #444; --fg-3: #747474;
    --line: #e5e5e5; --line-2: #c9c9c9; --bg: #fff; --bg-2: #f3f3f3; --bg-3: #fafaf9;
    --success: #2e844a; --success-bg: #ebf7e6; --warning: #8c4b02; --warning-bg: #fef1e6; --warning-ink: #fe9339;
    --error: #ba0517; --error-bg: #fef1ee; --info: #0176d3; --info-bg: #eef4ff;
  }
  [data-theme="dark"] {
    --fg: #f3f3f3; --fg-2: #c9c9c9; --fg-3: #aeaeae; --line: #3e3e3c; --line-2: #5c5c5c;
    --bg: #1a1b1e; --bg-2: #242528; --bg-3: #202124; --success-bg: #12301c; --warning-bg: #3a2509;
    --error-bg: #3b1013; --info-bg: #0b2545; --warning: #ffb75d; --error: #fe7765; --success: #45c65a;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: transparent; }
  body { font: 13px/1.5 "Salesforce Sans", -apple-system, "Segoe UI", system-ui, Roboto, Arial, sans-serif; color: var(--fg); }
  #app { padding: 2px; }
  .card { background: var(--bg); border: 1px solid var(--line-2); border-radius: .25rem; box-shadow: 0 2px 2px rgba(0,0,0,.06); overflow: hidden; }
  .card-hd { display: flex; align-items: center; gap: 8px; padding: 10px 14px; border-bottom: 1px solid var(--line); background: var(--bg-3); }
  .card-hd .logo { width: 22px; height: 22px; }
  .card-hd b { font-size: 13px; font-weight: 700; }
  .card-hd span { color: var(--fg-3); font-size: 12px; }
  .card-bd { padding: 14px; }
  .empty { padding: 28px; text-align: center; color: var(--fg-3); }
  .col { display: flex; flex-direction: column; min-width: 0; }
  .row { display: flex; min-width: 0; }
  .row > * { min-width: 0; }
  .g-xs { gap: 4px; } .g-sm { gap: 8px; } .g-md { gap: 12px; } .g-lg { gap: 18px; }
  .w-stretch { flex: 1 1 0; } .w-md { flex: 1 1 260px; } .w-lg { flex: 2 1 380px; }
  .box { border: 1px solid var(--line); border-radius: .25rem; padding: 12px; background: var(--bg); }
  .box.emphasis { background: var(--bg-2); border-color: var(--line); }
  .t-display { font-size: 28px; font-weight: 300; line-height: 1.2; }
  .t-h1 { font-size: 20px; font-weight: 700; line-height: 1.25; }
  .t-h2 { font-size: 18px; font-weight: 700; line-height: 1.25; }
  .t-h3 { font-size: 16px; font-weight: 700; }
  .t-h4 { font-size: 14px; font-weight: 700; }
  .t-h5 { font-size: 13px; font-weight: 700; }
  .t-section-title { font-size: 11px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--fg-3); }
  .t-caption { font-size: 12px; color: var(--fg-3); }
  .c-muted { color: var(--fg-3); } .c-warning { color: var(--warning); } .c-error { color: var(--error); }
  .w-bold { font-weight: 700; } .w-semibold { font-weight: 600; }
  .badge { display: inline-flex; align-items: center; padding: 1px 8px; border-radius: 15rem; font-size: 11px; font-weight: 600; line-height: 18px; white-space: nowrap; background: var(--bg-2); color: var(--fg-2); border: 1px solid transparent; }
  .badge.info { background: var(--info-bg); color: var(--info); }
  .badge.success { background: var(--success-bg); color: var(--success); }
  .badge.warning { background: var(--warning-bg); color: var(--warning); }
  .badge.error { background: var(--error-bg); color: var(--error); }
  .badge.outline { background: transparent; border-color: var(--line-2); }
  .badge.secondary { background: var(--bg-2); }
  hr { border: 0; border-top: 1px solid var(--line); margin: 4px 0; width: 100%; }
  .icon { display: inline-flex; align-items: center; justify-content: center; width: 40px; height: 40px; border-radius: .25rem; background: var(--brand); color: #fff; flex: none; }
  .icon svg { width: 22px; height: 22px; }
  .callout { border: 1px solid var(--line); border-left: 4px solid var(--info); border-radius: .25rem; padding: 10px 12px; background: var(--info-bg); }
  .callout.success { border-left-color: var(--success); background: var(--success-bg); }
  .callout.warning { border-left-color: var(--warning-ink); background: var(--warning-bg); }
  .callout.error { border-left-color: var(--error); background: var(--error-bg); }
  .callout.recommended { border-left-color: #9050e9; background: #f5efff; }
  [data-theme="dark"] .callout.recommended { background: #2a1c45; }
  .callout .eb { font-size: 10px; font-weight: 700; letter-spacing: .08em; color: var(--fg-3); }
  .callout .tt { font-weight: 700; }
  .callout .ds { color: var(--fg-2); margin-top: 2px; }
  .btn { display: inline-flex; align-items: center; gap: 6px; height: 32px; padding: 0 14px; border-radius: .25rem; border: 1px solid var(--line-2); background: var(--bg); color: var(--brand); font: inherit; font-weight: 600; cursor: pointer; white-space: nowrap; }
  .btn:hover { background: var(--bg-2); }
  .btn.primary { background: var(--brand); border-color: var(--brand); color: #fff; }
  .btn.primary:hover { background: var(--brand-dark); }
  .btn svg { width: 14px; height: 14px; }
  .tbl-cap { font-weight: 700; font-size: 14px; margin-bottom: 6px; }

  th.sortable { cursor: pointer; } th .ar { color: var(--fg-3); margin-left: 4px; }
  td { padding: 7px 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
  tr:last-child td { border-bottom: 0; }
  .striped tbody tr:nth-child(even) td { background: var(--bg-3); }
  .sm td { padding: 5px 10px; }
  .r { text-align: right; } .nw { white-space: nowrap; }
  td.tone { box-shadow: inset 3px 0 0 var(--line-2); }
  td.tone.warning { box-shadow: inset 3px 0 0 var(--warning-ink); }
  td.tone.error { box-shadow: inset 3px 0 0 var(--error); }
  td.tone.success { box-shadow: inset 3px 0 0 var(--success); }
  td.tone.info { box-shadow: inset 3px 0 0 var(--info); }
  .av { display: inline-flex; align-items: center; gap: 6px; }
  .av i { width: 22px; height: 22px; border-radius: 50%; background: #7f8de1; color: #fff; font: 600 10px/22px inherit; text-align: center; font-style: normal; flex: none; }
  .bar { height: 8px; background: var(--bg-2); border-radius: 4px; min-width: 80px; overflow: hidden; }
  .bar > div { height: 100%; background: var(--brand); }
  .tbl-foot { font-size: 12px; color: var(--fg-3); padding-top: 4px; }
  .viz-cap { font-weight: 700; font-size: 14px; margin-bottom: 6px; }
  svg text { font-family: inherit; fill: var(--fg-3); font-size: 11px; }
  svg .val { fill: var(--fg-2); font-weight: 600; }
  .legend { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 12px; color: var(--fg-2); margin-top: 4px; }
  .legend i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 5px; vertical-align: -1px; }
  .meter .top { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; }
  .meter .lbl { font-weight: 700; }
  .meter .vl { font-size: 12px; color: var(--fg-2); }
  .meter .track { position: relative; height: 14px; border-radius: 7px; background: var(--bg-2); margin: 8px 0 4px; overflow: visible; display: flex; }
  .meter.lg .track { height: 18px; border-radius: 9px; }
  .meter .band { height: 100%; opacity: .22; }
  .meter .band:first-child { border-radius: 9px 0 0 9px; } .meter .band:last-child { border-radius: 0 9px 9px 0; }
  .meter .fill { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 9px; background: var(--brand); }
  .meter .fill.warning { background: var(--warning-ink); } .meter .fill.error { background: var(--error); } .meter .fill.success { background: var(--success); }
  .meter .tgt { position: absolute; top: -4px; bottom: -4px; width: 2px; background: var(--fg); }
  .meter .foot { display: flex; justify-content: space-between; font-size: 11px; color: var(--fg-3); gap: 10px; }
  .hm { display: grid; gap: 3px; }
  .hm div { width: 14px; height: 14px; border-radius: 2px; background: var(--bg-2); }
  .tip { position: fixed; pointer-events: none; background: #032d60; color: #fff; padding: 4px 8px; border-radius: .25rem; font-size: 12px; z-index: 9; display: none; white-space: nowrap; }
</style>
</head>
<body>
<div id="app"><div class="card"><div class="empty">Waiting for Salesforce data…</div></div></div>
